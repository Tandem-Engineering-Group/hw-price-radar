name: lakehouse-renders

# Generates SK-set concept renders on the runner (open internet, unlike the
# Claude sandbox). Default engine is keyless: SDXL-Turbo open weights on the
# runner's CPU. The gemini engine (nano banana, better quality) is opt-in and
# needs the GEMINI_API_KEY Actions secret.
# Committing to site/** auto-triggers the daily-prices Pages deploy.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "hero = six-shot set, full = all fifteen"
        type: choice
        options: [hero, full]
        default: hero
      engine:
        description: "sdxl = keyless CPU render; gemini = needs GEMINI_API_KEY"
        type: choice
        options: [sdxl, gemini]
        default: sdxl

permissions:
  contents: write

defaults:
  run:
    working-directory: lakehouse

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Require GEMINI_API_KEY secret
        if: inputs.engine == 'gemini'
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::GEMINI_API_KEY secret not set (repo Settings → Secrets and variables → Actions). Get a key at https://aistudio.google.com/apikey — or dispatch with engine=sdxl, which needs no key"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache model weights
        if: inputs.engine == 'sdxl'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: local-sd-turbo-v1
      - run: pip install pyyaml pillow
      - name: Install SDXL deps (CPU torch)
        if: inputs.engine == 'sdxl'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers transformers accelerate safetensors
      - name: Generate renders
        timeout-minutes: 90
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python tools/render_shots.py --engine "${{ inputs.engine }}" --tier "${{ inputs.tier }}"
      - name: Commit renders
        # always(): a step timeout must not discard already-rendered shots —
        # the script refreshes the manifest after every image
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lakehouse-renders[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add ../site/lakehouse/renders/
          git diff --cached --quiet && exit 0
          git commit -m "lakehouse: concept renders (${{ inputs.engine }}, ${{ inputs.tier }} tier)"
          git pull --rebase origin main
          git push
          # GITHUB_TOKEN pushes don't fire the site/** trigger (recursion guard),
          # but a token-created workflow_dispatch does — kick the Pages deploy.
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-prices.yml/dispatches" \
            -d '{"ref":"main"}'
