name: daily-prices

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC ≈ 9:17am Detroit (EDT)
  workflow_dispatch:
  push:
    paths: ["site/**"]       # redeploy dashboard on edits; data commits use [skip ci]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Collect prices
        if: github.event_name != 'push'
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          THRESHOLDS_JSON: ${{ secrets.THRESHOLDS_JSON }}
        run: python src/collect.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "hw-price-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily price snapshot [skip ci]"
          git push

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: git pull --ff-only
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/*.json* _site/data/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
