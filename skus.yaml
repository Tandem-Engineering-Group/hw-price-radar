# hw-price-radar watchlist
# tiers: deterministic (collect.py fetches daily) | keepa (needs KEEPA_API_KEY)
#        agentic (weekly Cowork task, notes only) | watch (unreleased — detect listing)
# NOTE: no thresholds or quantities in this file — see CLAUDE.md hard rules.

skus:
  - id: ms-s1-max-128
    short: "MS-S1 MAX"
    references: { launch_price: 2299 }   # market fact, not a buy target
    name: "Minisforum MS-S1 MAX 128GB (Ryzen AI Max+ 395, 2TB)"
    category: strix-halo-mini
    sources:
      - retailer: minisforum
        tier: deterministic
        method: shopify_json
        store: "https://store.minisforum.com"
        handle: "minisforum-ms-s1-max-mini-pc"   # resolver falls back to catalog search on 404
        match_title: "MS-S1 MAX"
      - retailer: microcenter
        tier: deterministic
        method: html_regex
        url: "https://www.microcenter.com/product/702314/minisforum-ms-s1-max-next-gen-ai-workstation"
        price_marker: "Save $"
        min_price: 1500
        max_price: 6000
        storeid: "055"            # pins store context: 055 = Madison Heights MI
        stock_label: "Madison Heights"
        stock_regex: 'MI - Madison Heights \((in stock|out of stock)\)'
      - retailer: newegg
        tier: agentic
        note: "preorder $3,639 — ships 08/22 (confirmed 08/09)"
      - retailer: amazon
        tier: keepa
        asin: ""   # TODO: pin ASIN when relisted; last seen Feb 2026 at 3039 then OOS

